name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained EXE
        run: >-
          dotnet publish src/CrashLens.App/CrashLens.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/CrashLens-win-x64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/CrashLens-win-x64/CrashLens.App.exe

      - name: Upload test artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: CrashLens-win-x64
          path: artifacts/CrashLens-win-x64/CrashLens.App.exe
